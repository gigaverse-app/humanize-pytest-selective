name: Test

on:
  workflow_dispatch:
    inputs:
      full:
        type: choice
        options: ["true", "false"]
        required: true
      base:
        type: string
        required: true
  schedule:
    - cron: "17 4 * * 1"
run-name: Historical PR 494 full=${{ inputs.full }}

permissions: {}

env:
  FORCE_COLOR: 1
  PIP_DISABLE_PIP_VERSION_CHECK: 1

jobs:
  select-tests:
    runs-on: ubuntu-latest
    outputs:
      lanes: ${{ steps.plan.outputs.lanes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        uses: gigaverse-app/pytest-selective/actions/plan-lanes@v1
        with:
          config: .github/test-lanes.json
          base: ${{ inputs.base }}
          full: ${{ inputs.full }}

  test:
    needs: select-tests
    # A failed planner runs the matrix; only a successful plan can skip it.
    if: >-
      ${{ always() && !cancelled() && (needs.select-tests.result != 'success' ||
          fromJSON(needs.select-tests.outputs.lanes).tests) }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "pypy3.12"
          - "pypy3.11"
          - "3.15t"
          - "3.15"
          - "3.14t"
          - "3.14"
          - "3.13"
          - "3.12"
          - "3.11"
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Set PYTHON_GIL
        if: endsWith(matrix.python-version, 't')
        run: |
          echo "PYTHON_GIL=0" >> "$GITHUB_ENV"

      - name: Install Linux dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt install gettext

      - name: Install macOS dependencies
        if: startsWith(matrix.os, 'macos')
        run: |
          brew install gettext

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Generate translation binaries
        run: |
          scripts/generate-translation-binaries.sh

      - name: Tox tests
        run: |
          uvx --python ${{ matrix.python-version }} --with tox-uv tox -e py

      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          flags: ${{ matrix.os }}
          name: ${{ matrix.os }} Python ${{ matrix.python-version }}

  routing:
    needs: select-tests
    if: >-
      ${{ always() && !cancelled() && (needs.select-tests.result != 'success' ||
          fromJSON(needs.select-tests.outputs.lanes).routing) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Lane routing regressions
        run: |
          uv run --no-project --python 3.14 --with "pytest>=9" --with "pytest-selective>=1.3,<2" \
            python -m pytest ci/tests

  success:
    if: always()
    needs: [select-tests, test, routing]
    runs-on: ubuntu-latest
    name: Test successful
    steps:
      - name: Success
        env:
          PLAN_RESULT: ${{ needs.select-tests.result }}
          LANES: ${{ needs.select-tests.outputs.lanes }}
          TEST_RESULT: ${{ needs.test.result }}
          ROUTING_RESULT: ${{ needs.routing.result }}
        # Accept a skipped lane only when a successful plan explicitly returned false for it.
        run: |
          python3 - <<'PY'
          import json, os, sys

          if os.environ["PLAN_RESULT"] != "success":
              sys.exit(f"Lane planner result: {os.environ['PLAN_RESULT']}")
          lanes = json.loads(os.environ["LANES"])
          # Every required lane must have an explicit boolean decision.
          if not isinstance(lanes, dict) or any(type(lanes.get(lane)) is not bool for lane in ("tests", "routing")):
              sys.exit("Invalid lane plan")
          failed = False
          for lane, result in (("tests", os.environ["TEST_RESULT"]), ("routing", os.environ["ROUTING_RESULT"])):
              accepted = result == "success" or (result == "skipped" and lanes.get(lane) is False)
              print(f"{lane}: lane={lanes.get(lane)} result={result} accepted={accepted}")
              failed |= not accepted
          sys.exit(1 if failed else 0)
          PY
