name: Benchmark

on:
  workflow_dispatch:
    inputs:
      full:
        type: choice
        options: ["true", "false"]
        required: true
      base:
        type: string
        required: true
  schedule:
    - cron: "17 4 * * 1"
run-name: Historical PR 495 full=${{ inputs.full }}

permissions: {}

env:
  FORCE_COLOR: 1
  PIP_DISABLE_PIP_VERSION_CHECK: 1

jobs:
  select-tests:
    runs-on: ubuntu-latest
    outputs:
      lanes: ${{ steps.plan.outputs.lanes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        uses: gigaverse-app/pytest-selective/actions/plan-lanes@v1
        with:
          config: .github/test-lanes.json
          base: ${{ inputs.base }}
          full: ${{ inputs.full }}

  benchmarks:
    needs: select-tests
    # Preserve full manual/scheduled checkpoints; ordinary changes use the plan.
    # A failed planner never skips the benchmark lane.
    if: >-
      ${{ always() && !cancelled() && (needs.select-tests.result != 'success' ||
          fromJSON(needs.select-tests.outputs.lanes).benchmark) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15"
          allow-prereleases: true

      - name: Install gettext
        run: |
          sudo apt install gettext

      - name: Generate translation binaries
        run: |
          scripts/generate-translation-binaries.sh

      - name: Install dependencies
        run: pip install -e ".[tests]"

      # Forks cannot upload to the upstream CodSpeed integration.
      - name: Run benchmark tests on forks
        if: github.event.repository.fork == true
        run: pytest tests/test_benchmarks.py --benchmark-disable

      - name: Run benchmarks
        if: github.event.repository.fork == false
        uses: CodSpeedHQ/action@821a40cd6c80e3cfe387caf55668287addd808da # v5.5.0
        with:
          mode: simulation
          run: pytest tests/test_benchmarks.py --codspeed
